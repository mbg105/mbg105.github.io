<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Backdrop Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        .fullscreen-element { width: 100vw; height: 100vh; border: none; object-fit: contain; display: block; }
        #guide {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            color: white; font-family: sans-serif; font-size: 24px; text-align: center;
            background: rgba(0, 0, 0, 0.8); cursor: pointer; z-index: 99;
        }
    </style>
</head>
<body>

    <div id="guide" onclick="enableFullscreen()">
        Chạm/Nhấn OK trên remote để bật Fullscreen
    </div>

    <div id="display-area"></div>

    <script>
        // 1. Danh sách cấu hình ID -> Link media/slide tương ứng
        const backdropDatabase = {
            "bd1": "https://i.imgur.com/example.jpg",                // Link ảnh tĩnh
            "bd2": "https://i.imgur.com/example.gif",                // Link ảnh động GIF
            "slide1": "https://docs.google.com/presentation/d/e/.../embed?start=true&loop=true&delayms=3000" // Link Google Slides Embed
        };

        // 2. Trích xuất ID từ tham số URL (?id=...) hoặc từ đường dẫn (.../ID)
        const urlParams = new URLSearchParams(window.location.search);
        let backdropId = urlParams.get('id');
        
        if (!backdropId) {
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            backdropId = pathSegments[pathSegments.length - 1];
        }

        const container = document.getElementById('display-area');
        const mediaUrl = backdropDatabase[backdropId];

        // 3. Hiển thị Media
        if (mediaUrl) {
            if (mediaUrl.includes('docs.google.com') || mediaUrl.includes('embed') || mediaUrl.includes('.html')) {
                // Nếu là Slide/Trang web embed
                container.innerHTML = `<iframe src="${mediaUrl}" class="fullscreen-element" allow="autoplay"></iframe>`;
            } else {
                // Nếu là Ảnh/GIF
                container.innerHTML = `<img src="${mediaUrl}" class="fullscreen-element" alt="Backdrop">`;
            }
        } else {
            document.getElementById('guide').innerText = "Không tìm thấy Backdrop tương ứng với ID này!";
        }

        // 4. Hàm kích hoạt Toàn màn hình (Fullscreen API)
        function enableFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari / TV Bro */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
            document.getElementById('guide').style.display = 'none';
        }

        // Tự động ẩn thông báo sau 3 giây nếu người dùng không tương tác
        setTimeout(() => {
            const guide = document.getElementById('guide');
            if (guide && mediaUrl) guide.style.opacity = '0.3';
        }, 3000);
    </script>
</body>
</html>
